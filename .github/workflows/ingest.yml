name: hourly-ingestion

# Gap-free data collection that does NOT depend on a laptop being awake.
# Runs on GitHub's servers every hour, runs the ingestion, and commits the new
# raw snapshots back into the repo so the dataset accumulates in version control.
#
# Notes / caveats (for the report):
# - Cron is in UTC. GitHub may delay scheduled runs by several minutes under
#   load, and on rare occasions skip one. For hourly weather-market snapshots
#   that jitter is acceptable; it is still vastly more reliable than a laptop.
# - Scheduled workflows need repo activity within 60 days or GitHub disables
#   them. The hourly data commits keep the repo active, so this self-sustains.
# - Use a PUBLIC repo for unlimited Actions minutes (the data is public anyway).

on:
  schedule:
    # Run at :17 past every hour (UTC). NOT :00 — the top of the hour is the most
    # congested slot on GitHub's shared scheduler, so runs there get delayed or
    # skipped. An off-peak minute is far more reliable for hourly collection.
    - cron: "17 * * * *"
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

# Allow the job to push commits back to the repo.
permissions:
  contents: write

# Never let two ingestion runs overlap (would race on the git push).
concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: python run_ingestion.py

      - name: Commit new raw snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new data this run."
            exit 0
          fi
          git commit -m "data: ingestion snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Robust gegen gleichzeitige Laeufe (Schedule + externer Cron):
          # NDJSON-Anhaenge mergen per .gitattributes (merge=union) konfliktfrei;
          # Push mit Retry statt frueherem '|| true' (das liess bei einer
          # Trigger-Kollision Konfliktmarker im Arbeitsbaum stehen, was das
          # Quality-Gate danach zu Recht rot machte). Bei jedem Fehlschlag wird
          # ein evtl. haengender Rebase abgebrochen und neu versucht.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "pushed on attempt ${attempt}"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "push attempt ${attempt} failed (concurrent run?), retrying..."
            sleep $((RANDOM % 5 + 3))
          done
          echo "ERROR: push nach 5 Versuchen fehlgeschlagen"
          exit 1

      # Quality gate (AP 2.3): runs AFTER the data commit on purpose - a red gate
      # must not block persisting valid raw data; it makes quality problems visible
      # (red run + GitHub notification = P1 path of docs/alerting_konzept.md).
      - name: Build silver (fresh, for the gate)
        run: python build_silver.py

      - name: Quality gate (18 checks, exit 1 on FAIL)
        run: python quality_checks.py
